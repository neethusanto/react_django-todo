services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
    volumes:
      - django_static:/app/staticfiles
      - django_db:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  django_static:
  django_db:
